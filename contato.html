<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Identidade visual -->
     <link rel="icon" type="image/jpeg" href="./img/logo_cordeirinho.jpeg">
     <link rel="stylesheet" href="./contato.css">
    <title>Cordeirinho|Contato</title>
</head>
<body>
    
    
    <!-- ================= CABEÇALHO ================= -->

    <header>

        <div class="logo">
            <a href="index.html" aria-label="Página inicial do Cordeirinho">
                <img src="./img/logo_cordeirinho.jpeg"
                     alt="Logo do restaurante Cordeirinho">
            </a>
        </div>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="cardapio.html">Cardápio</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
            
        </nav>

    </header>

    
        <!-- BANNER / CARROSSEL -->

       
        <section class="carrossel" aria-label="Destaques do restaurante">

            <div class="slides">

                <div class="slide ativo">
                    <img src="./img/bannerinicio.jpeg" alt="Banner principal do Cordeirinho">
                </div>

                <div class="slide">
                    <img src="./img/bannerinicio03.jpeg" alt="Banner de apresentação">
                </div>

                <div class="slide">
                    <img src="./img/bannerinicio02.jpeg" alt="Banner promocional">
                </div>
                

            </div>


<div class="banner-formulario">

    <h2>Entre em contato e tire suas duvidas!</h2>

    <p>Deixe seus dados e fale conosco pelo WhatsApp.</p>

    <form id="formWhatsApp">

        <input 
            type="text" 
            id="nome" 
            placeholder="Seu nome"
            required
        >

        <input 
            type="email" 
            id="email" 
            placeholder="Seu e-mail"
            required
        >

        <button type="submit">
            Falar pelo WhatsApp
        </button>

    </form>
    </section>

</div>
        <footer>
            <p>Todos os direitos reservados - © 2026 - CORDEIRINHO</p>
        </footer>
</body>

<script src="./main.js" defer></script>
</html>
